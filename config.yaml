# Configuration for rater error prediction experiments.
# Expected image names: case<d>axial.jpg, case<d>coronal.jpg, case<d>sagittal.jpg

data:
  training_file: data/TRAINING-FINALE.xlsx
  image_dir: data/images
  id_column: id
  target_column: error-rating
  case_id_separator: "-"
  numeric_features:
    - rating-confidence
    - case-difficulty
    - rater-expertise
    - rater-accuracy
    - rater-confidence

validation:
  n_splits: 5
  random_state: 42

images:
  image_size: 224
  orientations:
    - axial
    - coronal
    - sagittal
  extension: jpg
  pretrained: true
  freeze_backbone: true
  embedding_aggregation: concat  # concat or mean

training:
  batch_size: 16
  num_epochs: 40
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  early_stopping_patience: 8
  device: auto  # auto, cpu, cuda

outputs:
  root_dir: outputs
