# Two-stage pipeline: diagnostic (TARGET) -> solution D (error-rating).
# Locks: no TARGET in D features; fixed hyperparams; nested default.
# Expected images: case{i}axial.jpg, case{i}coronal.jpg, case{i}sagittal.jpg

data:
  user_infos_file: data/USER-INFOS-CORRECTED.xlsx
  ground_truth_file: data/IMAGE-GROUND-TRUTH.xlsx
  image_dir: data/images
  id_column: id
  case_id_column: CASE-ID
  target_diagnostic: TARGET
  target_error: error-rating
  case_id_separator: "-"
  # Excel globals — loadable but must NOT be used in CV (replaced by fold-safe LOO).
  excel_global_rater_stats:
    - rater-accuracy
    - rater-confidence

validation:
  n_splits: 5
  random_state: 42
  # Joint stratification: TARGET + case mean error-rating vs median
  stratify_on_target: true
  stratify_on_error_median: true

images:
  image_size: 224
  resize_size: 256
  orientations:
    - axial
    - coronal
    - sagittal
  extension: jpg
  pretrained: true
  embedding_aggregation: concat  # concat -> 1536-d
  rotation_degrees: 5

# diagnostic (fixed a priori — no test-set tuning)
diagnostic:
  batch_size: 12  # allowed range 8-12
  num_epochs: 15
  learning_rate: 0.0001
  weight_decay: 0.0001
  dropout: 0.35
  hidden_dim: 256
  early_stopping_patience: 4
  freeze_epochs: 2
  unfreeze_layer4_only: true
  num_workers: 4
  device: auto  # auto, cpu, cuda
  seed: 42

# Solution D (fixed a priori — no test-set hyperparam search)
solution_d:
  protocol: nested  # nested (default, scientific) | fast (optimistic, declared)
  # Allowlist closed — TARGET must never appear here
  features:
    - rating-confidence
    - case-difficulty
    - rater-expertise
    - rater-accuracy
    - rater-confidence
    - rating
    - ai_probability_class_1
    - ai_predicted_class
    - rater_ai_disagreement
    - ai_probability_rater_wrong
    - ai_margin
  forbidden_features:
    - TARGET
  inner_n_splits: 4
  xgb:
    n_estimators: 400
    max_depth: 3
    learning_rate: 0.03
    subsample: 0.8
    colsample_bytree: 0.8
    objective: binary:logistic
    eval_metric: logloss
    # seed = base_seed + fold_index at runtime
    base_seed: 42
  use_scale_pos_weight: true
  also_run_without_weighting: true

reproducibility:
  seed: 42

outputs:
  root_dir: outputs
  folds_dir: outputs/folds
  diagnostic_dir: outputs/diagnostic
  baseline_dir: outputs/baseline
  d_dir: outputs/D
  compare_dir: outputs/compare
  analysis_dir: outputs/analysis
  run_config_snapshot: outputs/run_config_snapshot.yaml
  environment_file: outputs/environment.txt

models:
  diagnostic_dir: models/diagnostic
  d_dir: models/D
